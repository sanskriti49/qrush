spring.application.name=qrush-backend
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Local defaults match docker-compose.yml. Override via environment for another host.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/qrush_db}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password123}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never

# Operator actions are intended for this loopback-bound development workspace.
qrush.operator.enabled=${QRUSH_OPERATOR_ENABLED:true}
qrush.scheduling.enabled=${QRUSH_SCHEDULING_ENABLED:true}
